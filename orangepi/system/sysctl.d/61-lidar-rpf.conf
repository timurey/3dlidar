# Hesai Pandar broadcasts UDP from its factory source IP 192.168.1.201 to
# 255.255.255.255:2368 on the isolated eth0 lidar link. With reverse-path
# filtering on, the kernel drops those packets unless 192.168.1.0/24 is routable
# — which only happened to be true while on home wifi. In field/AP mode (wlan0 =
# 10.42.0.x) that route disappears and the lidar goes silent. Effective rp_filter
# = max(conf.all, conf.iface), so 'all' must be 0 for the eth0 override to apply.
# wlan0 stays protected.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.eth0.rp_filter = 0
net.ipv4.conf.wlan0.rp_filter = 2
